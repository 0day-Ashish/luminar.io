[package]
name = "ultrahonk_soroban_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "26.1.0", default-features = false, features = ["alloc"] }
ultrahonk_rust_verifier = { package = "ultrahonk_soroban_verifier", path = "../ultrahonk-rust-verifier/crates/ultrahonk-soroban-verifier" }

[dev-dependencies]
# Enable test helpers for local unit tests
soroban-sdk = { version = "26.1.0", features = ["testutils", "alloc"] }
soroban-env-host = { git = "https://github.com/stellar/rs-soroban-env", rev = "cf58d535ab05d02802a5e804a95524650f8c62c7" }

[profile.release]
opt-level = "z"
lto = true
overflow-checks = true
codegen-units = 1
panic = "abort"
strip = true
